name: Build Universal Zygisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Compile for all ABIs
        run: |
          mkdir -p out/zygisk
          cp module.prop out/
          cp drm.prop out/
          cp target.prop out/
          cp device.prop out/

          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin

          # ARM64
          $TOOLCHAIN/aarch64-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/arm64-v8a.so -llog -lGLESv2

          # ARM32
          $TOOLCHAIN/armv7a-linux-androideabi21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/armeabi-v7a.so -llog -lGLESv2

          # x86
          $TOOLCHAIN/i686-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/x86.so -llog -lGLESv2

          # x86_64
          $TOOLCHAIN/x86_64-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/x86_64.so -llog -lGLESv2

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p out/META-INF/com/google/android
          echo "#MAGISK" > out/META-INF/com/google/android/updater-script
          cat << 'EOF' > out/META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Please install Magisk v20.4+! "
            ui_print "*******************************"
            exit 1
          }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          [ $MAGISK_VER_CODE -lt 20400 ] && require_new_magisk
          install_module
          exit 0
          EOF
          chmod 755 out/META-INF/com/google/android/update-binary
          cd out
          zip -r ../drm-spoofer-universal.zip .

      - name: Upload Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: drm-spoofer-universal
          path: drm-spoofer-universal.zip
