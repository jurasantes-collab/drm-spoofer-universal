name: Build Universal Zygisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Compile for all ABIs
        run: |
          mkdir -p out/zygisk
          cp module.prop out/
          cp drm.prop out/

          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin

          # ARM64 (64 bits)
          $TOOLCHAIN/aarch64-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/arm64-v8a.so -llog

          # ARM32 (armeabi-v7a)
          $TOOLCHAIN/armv7a-linux-androideabi21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/armeabi-v7a.so -llog

          # x86 (32 bits)
          $TOOLCHAIN/i686-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/x86.so -llog

          # x86_64 (64 bits)
          $TOOLCHAIN/x86_64-linux-android21-clang++ -std=c++17 -O2 -shared -fPIC main.cpp -o out/zygisk/x86_64.so -llog

      - name: Package Magisk Module ZIP
        run: |
          mkdir -p out/META-INF/com/google/android
          curl -sL https://githubusercontent.com -o out/META-INF/com/google/android/update-binary
          echo "#MAGISK" > out/META-INF/com/google/android/updater-script
          cd out
          zip -r ../drm-spoofer-universal.zip .

      - name: Upload Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: drm-spoofer-universal
          path: drm-spoofer-universal.zip
